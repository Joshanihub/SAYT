name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm
        run: npm install --global pnpm@12.23.0

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install exact Rust toolchain
        run: rustup show active-toolchain

      - name: Install pinned Rust audit tools
        run: |
          cargo install --locked cargo-deny --version 0.22.1
          cargo install --locked cargo-audit --version 0.23.0

      - name: Check formatting
        run: |
          cargo fmt --all --check
          pnpm format:check

      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          pnpm lint

      - name: Typecheck and build frontend
        run: |
          pnpm typecheck
          pnpm build

      - name: Run tests
        run: |
          cargo test --workspace
          pnpm test

      - name: Audit Rust dependency policy and advisories
        run: |
          cargo deny check --hide-inclusion-graph bans licenses sources
          cargo audit

      - name: Audit JavaScript advisories
        run: pnpm audit

      - name: List resolved JavaScript licenses
        run: pnpm licenses list --recursive
